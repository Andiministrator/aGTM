<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --fg: #1c2126; --muted: #6b7680; --border: #e2e6ea;
    --panel: #f6f8fa; --accent: #0b7285; --accent-fg: #ffffff;
    --ok: #2b8a3e; --warn: #e67700; --err: #c92a2a; --chip: #eef1f4;
  }
  body.dark {
    --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --border: #3c4043;
    --panel: #292a2d; --accent: #4dabf7; --accent-fg: #10233a;
    --ok: #51cf66; --warn: #ffa94d; --err: #ff6b6b; --chip: #35363a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.forced) {
      --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --border: #3c4043;
      --panel: #292a2d; --accent: #4dabf7; --accent-fg: #10233a;
      --ok: #51cf66; --warn: #ffa94d; --err: #ff6b6b; --chip: #35363a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  header .spacer { flex: 1; }
  header .ver { color: var(--muted); font-variant-numeric: tabular-nums; }
  nav {
    display: flex; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--border);
    flex: 0 0 auto; overflow-x: auto;
  }
  nav button {
    background: none; border: none; color: var(--muted); padding: 8px 12px;
    cursor: pointer; font: inherit; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  main { flex: 1 1 auto; overflow: auto; padding: 10px; }
  section { display: none; }
  section.active { display: block; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; align-items: baseline; }
  .grid .k { color: var(--muted); }
  .grid .v { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-word; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--chip);
    font-family: ui-monospace, monospace; font-size: 11px; margin: 0 3px 3px 0;
  }
  .chip.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .chip.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .chip.err { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--err); }
  .chip.acc { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
  td.mono, .mono { font-family: ui-monospace, monospace; }
  tr.evt:hover { background: var(--panel); }
  tr.row-toggle { cursor: pointer; }
  th.caret-h { width: 18px; padding-left: 8px; }
  td.caret { width: 18px; color: var(--muted); text-align: center; user-select: none; }
  tr.detail td { border-bottom: 1px solid var(--border); }
  pre.jsonview { max-height: 42vh; margin: 4px 0; }
  .json-key { color: var(--accent); }
  .json-string { color: var(--ok); }
  .json-number { color: var(--warn); }
  .json-bool { color: var(--err); font-weight: 600; }
  .json-null { color: var(--muted); }
  table.compact th, table.compact td { padding: 2px 8px; }
  table.compact td.caret { padding: 2px 4px; }
  .nowrap { white-space: nowrap; }
  .tag-msg { color: var(--accent); font-style: italic; }
  /* fit = shrink to content (columns cluster tight on the left); one col-grow/col-url
     column takes the remaining width. */
  td.fit, th.fit { width: 1%; white-space: nowrap; }
  td.col-grow { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.col-url { width: 100%; }
  .preview { color: var(--muted); font-family: ui-monospace, monospace; font-size: 11px; }
  .preview .pk { color: var(--accent); }
  .u-host { color: var(--muted); }
  .u-path { color: var(--fg); font-weight: 600; }
  .u-params { margin-top: 2px; }
  .chip.qp { font-size: 10px; padding: 0 5px; }
  /* consent fingerprint — compact per-category granted/denied pills for the list view */
  .cfp-row { display: inline-flex; gap: 2px; vertical-align: 1px; }
  .cfp { font-family: ui-monospace, monospace; font-size: 9px; line-height: 14px;
    padding: 0 4px; border-radius: 3px; background: var(--chip); color: var(--muted); }
  .cfp-g { background: color-mix(in srgb, var(--ok) 26%, transparent); color: var(--ok); }
  .cfp-d { background: color-mix(in srgb, var(--err) 26%, transparent); color: var(--err); }
  .cfp-u { background: var(--chip); color: var(--muted); }
  .cfp-x { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .net-en { margin-top: 2px; font-family: ui-monospace, monospace; font-size: 10px; color: var(--accent); }
  /* Exception preview in the network list: readable, but not shouting — the row is
     still a network row, not an error banner. Left rule + muted red carries "problem"
     without the weight of a chip. */
  /* The effect panel stays in view while you scroll the (long) Simulation tab, so an
     action's result is never reported off-screen. */
  /* The action result is the whole point of the panel — it was 11px muted text that
     users scrolled past. Give it room and contrast. */
  .sim-det { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--fg);
             background: var(--bg); border-left: 3px solid var(--accent);
             border-radius: 4px; padding: 7px 10px; }
  .sim-live-card { position: sticky; top: 0; z-index: 6; box-shadow: 0 6px 12px -8px rgba(0,0,0,.6); }
  .net-exc { margin-top: 3px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
             border-left: 2px solid var(--err); padding-left: 6px; }
  .net-exc-t { font-size: 10px; font-weight: 600; color: var(--err); white-space: nowrap; }
  .net-exc-m { font-family: ui-monospace, monospace; font-size: 11px; color: var(--fg);
               opacity: .85; word-break: break-word; }
  .net-id { margin-top: 1px; font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); }
  .net-search { flex: 1; min-width: 120px; max-width: 320px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font: inherit; }
  .net-search:focus { outline: none; border-color: var(--accent); }
  .net-hosts { flex-wrap: wrap; gap: 4px 12px; margin-top: -4px; margin-bottom: 8px; font-size: 11px; }
  .net-hosts label { gap: 3px; }
  .net-detail .grid { grid-template-columns: max-content 1fr max-content 1fr; gap: 2px 10px; }
  .net-sub { cursor: pointer; padding: 4px 0 2px; font-weight: 600; font-size: 11px; color: var(--fg); border-top: 1px solid var(--border); margin-top: 4px; user-select: none; }
  .net-sub:hover { color: var(--accent); }
  .net-detail pre.jsonview { max-height: 30vh; }
  /* dataLayer event categories */
  .ev-tag { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 10px; font-weight: 600;
    background: var(--chip); color: var(--muted); vertical-align: 1px; }
  .ev-gtm    { color: var(--muted); }
  .ev-agtm   { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .ev-ecom   { color: var(--ok);     background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .ev-pv     { color: #ae3ec9;        background: color-mix(in srgb, #ae3ec9 16%, transparent); }
  .ev-consent{ color: var(--warn);   background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .ev-user   { color: var(--fg); }
  .ev-gtag   { color: #1098ad;        background: color-mix(in srgb, #1098ad 16%, transparent); }
  .ev-consent-cmd { color: var(--warn); background: color-mix(in srgb, var(--warn) 20%, transparent); font-weight: 700; }
  .ev-msg    { color: var(--muted); font-style: italic; }
  tr.dl-consent td { background: color-mix(in srgb, var(--warn) 7%, transparent); }
  tr.dl-consent td.caret { box-shadow: inset 2px 0 0 var(--warn); }
  span.mono.ev-agtm, span.mono.ev-ecom, span.mono.ev-pv, span.mono.ev-consent, span.mono.ev-gtag { background: none; }
  /* consent-mode step labels */
  .chip.cm-declare  { background: color-mix(in srgb, #7048e8 20%, transparent); color: #7048e8; }
  .chip.cm-implicit { background: var(--chip); color: var(--muted); }
  .chip.cm-default  { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .chip.cm-update   { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; color: var(--muted); }
  .toolbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  pre {
    margin: 0; white-space: pre; overflow-x: auto; font-family: ui-monospace, monospace;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; max-height: 60vh;
  }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .muted { color: var(--muted); }
  .warnbox { border-left: 3px solid var(--warn); padding-left: 10px; }
  .leakbox { border-left: 3px solid var(--err); padding-left: 10px; }
  .leakbox h2 { color: var(--err); }
  button.small { background: var(--panel); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; }
  button.small:hover { border-color: var(--accent); color: var(--accent); }
  code { font-family: ui-monospace, monospace; }
  /* ── Diagnose tab ────────────────────────────────────────────────── */
  /* Health-Score ampel banner */
  .score { display: flex; align-items: center; gap: 12px; }
  .score-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px;
    padding: 6px 14px; border-radius: 10px; letter-spacing: .3px; }
  .score-badge .lamp { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .score-pass { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .score-pass .lamp { background: var(--ok); }
  .score-warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .score-warn .lamp { background: var(--warn); }
  .score-fail { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }
  .score-fail .lamp { background: var(--err); }
  .score-counts { color: var(--muted); font-size: 11px; }
  /* per-check rows */
  .checks { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .check { display: grid; grid-template-columns: 18px max-content 1fr; gap: 8px; align-items: baseline; padding: 3px 0; border-top: 1px solid var(--border); }
  .check:first-child { border-top: none; }
  .check .ci { text-align: center; font-weight: 700; }
  .check .cl { font-weight: 600; white-space: nowrap; }
  .check .cd { color: var(--muted); }
  .ci-pass { color: var(--ok); } .ci-warn { color: var(--warn); } .ci-fail { color: var(--err); } .ci-na { color: var(--muted); }
  /* consent timeline waterfall */
  .tl { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .tl-row { display: grid; grid-template-columns: 130px 66px 1fr; gap: 8px; align-items: center; }
  .tl-lab { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-rel { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); text-align: right; }
  .tl-track { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tl-bar-wrap { flex: 1; background: var(--chip); border-radius: 4px; height: 12px; overflow: hidden; }
  /* display:block is load-bearing — a <span> is inline, where width/height are ignored,
     so the fill had no visible area (only the track showed). */
  .tl-bar { display: block; height: 100%; background: var(--accent); border-radius: 4px; min-width: 2px; }
  /* per-milestone bar colours: mostly panel palette vars (theme-aware), plus two
     dedicated mid-tone hues for inject/firstTag that read on both light + dark tracks. */
  .tl-bar.b-navStart { background: var(--muted); }
  .tl-bar.b-config   { background: var(--accent); }
  .tl-bar.b-pending  { background: var(--warn); }
  .tl-bar.b-consent  { background: var(--ok); }
  .tl-bar.b-inject   { background: #ae3ec9; }
  .tl-bar.b-firstTag { background: #1098ad; }
  .tl-bar.b-leak     { background: var(--err); }
  .tl-leak { color: var(--err); font-size: 10px; margin-left: 6px; }
  /* "waiting on" block — pending lifecycle milestones the timeline is still blocked on */
  .tl-waithd { color: var(--muted); font-size: 11px; margin-top: 10px; margin-bottom: 2px; }
  .tl-wait { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; flex-wrap: wrap; }
  .tl-wait-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); align-self: center; flex: 0 0 auto; animation: tl-pulse 1.4s ease-in-out infinite; }
  @keyframes tl-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .tl-wait-dot { animation: none; opacity: .8; } }
  .tl-wait-lab { font-weight: 600; color: var(--warn); white-space: nowrap; }
  .tl-wait-detail { color: var(--muted); font-size: 11px; }
  .tl-wait-detail .mono { color: var(--fg); }
  .report-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .copied { color: var(--ok); font-size: 11px; align-self: center; }
  /* prominent Session-ID / User-ID rows */
  .idbig { display: flex; align-items: baseline; gap: 10px; margin: 3px 0; flex-wrap: wrap; }
  .idbig > .lab { color: var(--muted); font-size: 11px; min-width: 84px; }
  .idbig .val { font-family: ui-monospace, monospace; font-size: 15px; font-weight: 700; color: var(--accent); word-break: break-all; }
  .idbig .since { color: var(--muted); font-size: 10px; }
  /* Session KPI stat tiles — neutral ink, no series colours (dataviz: text tokens only) */
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .stat { flex: 1 1 92px; min-width: 92px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .stat .num { font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--fg); }
  .stat .lab { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; margin-top: 3px; }
  .stat .sub { color: var(--muted); font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>
  <header>
    <span class="brand">aGTM Inspector</span>
    <span class="status"><span id="live-dot" class="dot"></span><span id="live-text">warte auf aGTM…</span></span>
    <span class="spacer"></span>
    <span class="ver" id="ver"></span>
  </header>
  <nav id="tabs">
    <button data-tab="diagnose" class="active">Diagnose</button>
    <button data-tab="consent">Consent</button>
    <button data-tab="events">Events</button>
    <button data-tab="datalayer">dataLayer</button>
    <button data-tab="session">Session</button>
    <button data-tab="config">Config</button>
    <button data-tab="network">Netzwerk</button>
    <button data-tab="sim">Simulation</button>
  </nav>
  <main>
    <section id="tab-diagnose" class="active"></section>
    <section id="tab-consent"></section>
    <section id="tab-events"></section>
    <section id="tab-datalayer"></section>
    <section id="tab-session"></section>
    <section id="tab-config"></section>
    <section id="tab-network"></section>
    <section id="tab-sim"></section>
  </main>
  <script src="logmap.js"></script>
  <script src="netclassify.js"></script>
  <script src="consentsignals.js"></script>
  <script src="cmpdetect.js"></script>
  <script src="diagnose.js"></script>
  <script src="jsonview.js"></script>
  <script src="panel.js"></script>
  <script src="sim.js"></script>
</body>
</html>
