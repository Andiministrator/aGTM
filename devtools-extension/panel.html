<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --fg: #1c2126; --muted: #6b7680; --border: #e2e6ea;
    --panel: #f6f8fa; --accent: #0b7285; --accent-fg: #ffffff;
    --ok: #2b8a3e; --warn: #e67700; --err: #c92a2a; --chip: #eef1f4;
  }
  body.dark {
    --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --border: #3c4043;
    --panel: #292a2d; --accent: #4dabf7; --accent-fg: #10233a;
    --ok: #51cf66; --warn: #ffa94d; --err: #ff6b6b; --chip: #35363a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.forced) {
      --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --border: #3c4043;
      --panel: #292a2d; --accent: #4dabf7; --accent-fg: #10233a;
      --ok: #51cf66; --warn: #ffa94d; --err: #ff6b6b; --chip: #35363a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  header .spacer { flex: 1; }
  header .ver { color: var(--muted); font-variant-numeric: tabular-nums; }
  nav {
    display: flex; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--border);
    flex: 0 0 auto; overflow-x: auto;
  }
  nav button {
    background: none; border: none; color: var(--muted); padding: 8px 12px;
    cursor: pointer; font: inherit; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  main { flex: 1 1 auto; overflow: auto; padding: 10px; }
  section { display: none; }
  section.active { display: block; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; align-items: baseline; }
  .grid .k { color: var(--muted); }
  .grid .v { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-word; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--chip);
    font-family: ui-monospace, monospace; font-size: 11px; margin: 0 3px 3px 0;
  }
  .chip.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .chip.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .chip.err { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--err); }
  .chip.acc { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
  td.mono, .mono { font-family: ui-monospace, monospace; }
  tr.evt:hover { background: var(--panel); }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; color: var(--muted); }
  .toolbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  pre {
    margin: 0; white-space: pre; overflow-x: auto; font-family: ui-monospace, monospace;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; max-height: 60vh;
  }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .muted { color: var(--muted); }
  .warnbox { border-left: 3px solid var(--warn); padding-left: 10px; }
  button.small { background: var(--panel); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; }
  button.small:hover { border-color: var(--accent); color: var(--accent); }
  code { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <header>
    <span class="brand">aGTM Inspector</span>
    <span class="status"><span id="live-dot" class="dot"></span><span id="live-text">warte auf aGTM…</span></span>
    <span class="spacer"></span>
    <span class="ver" id="ver"></span>
  </header>
  <nav id="tabs">
    <button data-tab="consent" class="active">Consent</button>
    <button data-tab="events">Events</button>
    <button data-tab="gtm">GTM</button>
    <button data-tab="session">Session</button>
    <button data-tab="config">Config</button>
    <button data-tab="network">Netzwerk</button>
  </nav>
  <main>
    <section id="tab-consent" class="active"></section>
    <section id="tab-events"></section>
    <section id="tab-gtm"></section>
    <section id="tab-session"></section>
    <section id="tab-config"></section>
    <section id="tab-network"></section>
  </main>
  <script src="logmap.js"></script>
  <script src="netclassify.js"></script>
  <script src="panel.js"></script>
</body>
</html>
